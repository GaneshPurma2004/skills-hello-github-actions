name: GitHub Actions Context Demo

run-name: Context demo for ${{ inputs.environment }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the target environment"
        required: true
        type: choice
        options:
          - development
          - testing
          - production
        default: development

      node-version:
        description: "Select the default Node.js version"
        required: true
        type: choice
        options:
          - "18"
          - "20"
          - "22"
        default: "20"

      run-tests:
        description: "Run the test demonstration"
        required: true
        type: boolean
        default: true

      message:
        description: "Enter a custom message"
        required: false
        type: string
        default: "Hello from workflow_dispatch"

# Workflow-level environment variables
env:
  WORKFLOW_MESSAGE: "This is a workflow-level environment variable"
  TARGET_ENVIRONMENT: ${{ inputs.environment }}

jobs:

  # ----------------------------------------------------------
  # Job 1: Demonstrate github, env, vars, inputs, runner,
  # job, steps and secrets contexts
  # ----------------------------------------------------------
  prepare:
    name: Prepare and inspect contexts
    runs-on: ubuntu-latest

    # Job-level environment variable
    env:
      JOB_MESSAGE: "This is a job-level environment variable"
      SELECTED_NODE: ${{ inputs.node-version }}

    outputs:
      generated-message: ${{ steps.create-output.outputs.message }}
      selected-environment: ${{ steps.create-output.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # github context
      - name: Demonstrate github context
        env:
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_OR_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Triggered by: $ACTOR"
          echo "Workflow name: $WORKFLOW_NAME"
          echo "Event name: $EVENT_NAME"
          echo "Branch or ref: $BRANCH_OR_REF"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Run ID: $RUN_ID"
          echo "Run number: $RUN_NUMBER"

      # env context
      - name: Demonstrate env context
        env:
          STEP_MESSAGE: "This is a step-level environment variable"
        run: |
          echo "Workflow-level env: $WORKFLOW_MESSAGE"
          echo "Job-level env: $JOB_MESSAGE"
          echo "Step-level env: $STEP_MESSAGE"
          echo "Target environment: $TARGET_ENVIRONMENT"
          echo "Selected Node version: $SELECTED_NODE"

      # inputs context
      - name: Demonstrate inputs context
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
          INPUT_RUN_TESTS: ${{ inputs.run-tests }}
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          echo "Environment input: $INPUT_ENVIRONMENT"
          echo "Node version input: $INPUT_NODE_VERSION"
          echo "Run tests input: $INPUT_RUN_TESTS"
          echo "Custom message input: $INPUT_MESSAGE"

      # vars context
      - name: Demonstrate vars context
        env:
          DEMO_VARIABLE: ${{ vars.DEMO_VARIABLE }}
        run: |
          if [ -n "$DEMO_VARIABLE" ]; then
            echo "Repository variable DEMO_VARIABLE: $DEMO_VARIABLE"
          else
            echo "DEMO_VARIABLE is not configured."
            echo "Create it under Settings > Secrets and variables > Actions > Variables."
          fi

      # runner context
      - name: Demonstrate runner context
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_TEMP: ${{ runner.temp }}
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner temporary directory: $RUNNER_TEMP"
          echo "Runner tool cache: $RUNNER_TOOL_CACHE"

      # secrets context
      - name: Demonstrate secrets context safely
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN is available to this workflow."
            echo "For security, its actual value will not be printed."
          else
            echo "DEMO_TOKEN is not configured."
          fi

      # Create step outputs
      - name: Create a step output
        id: create-output
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "message=$INPUT_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "environment=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      # steps context
      - name: Demonstrate steps context
        env:
          STEP_MESSAGE_OUTPUT: ${{ steps.create-output.outputs.message }}
          STEP_ENVIRONMENT_OUTPUT: ${{ steps.create-output.outputs.environment }}
          STEP_OUTCOME: ${{ steps.create-output.outcome }}
          STEP_CONCLUSION: ${{ steps.create-output.conclusion }}
        run: |
          echo "Output from previous step: $STEP_MESSAGE_OUTPUT"
          echo "Environment from previous step: $STEP_ENVIRONMENT_OUTPUT"
          echo "Previous step outcome: $STEP_OUTCOME"
          echo "Previous step conclusion: $STEP_CONCLUSION"

      # job context
      - name: Demonstrate job context
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          echo "Current job status: $CURRENT_JOB_STATUS"

  # ----------------------------------------------------------
  # Job 2: Demonstrate strategy and matrix contexts
  # ----------------------------------------------------------
  matrix-demo:
    name: Node ${{ matrix.node-version }} on ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        operating-system:
          - ubuntu-latest
        node-version:
          - "18"
          - "20"
          - "22"

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # matrix and strategy contexts
      - name: Demonstrate matrix and strategy contexts
        env:
          MATRIX_NODE_VERSION: ${{ matrix.node-version }}
          MATRIX_OS: ${{ matrix.operating-system }}
          MATRIX_JOB_INDEX: ${{ strategy.job-index }}
          MATRIX_JOB_TOTAL: ${{ strategy.job-total }}
          MATRIX_MAX_PARALLEL: ${{ strategy.max-parallel }}
        run: |
          echo "Matrix Node version: $MATRIX_NODE_VERSION"
          echo "Matrix operating system: $MATRIX_OS"
          echo "Current matrix job index: $MATRIX_JOB_INDEX"
          echo "Total matrix jobs: $MATRIX_JOB_TOTAL"
          echo "Maximum parallel jobs: $MATRIX_MAX_PARALLEL"

          echo "Installed Node version:"
          node --version

  # ----------------------------------------------------------
  # Job 3: Demonstrate needs context
  # ----------------------------------------------------------
  consume-output:
    name: Consume output from prepare job
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Demonstrate needs context
        env:
          PREVIOUS_JOB_RESULT: ${{ needs.prepare.result }}
          PREVIOUS_JOB_MESSAGE: ${{ needs.prepare.outputs.generated-message }}
          PREVIOUS_JOB_ENVIRONMENT: ${{ needs.prepare.outputs.selected-environment }}
        run: |
          echo "Prepare job result: $PREVIOUS_JOB_RESULT"
          echo "Message from prepare job: $PREVIOUS_JOB_MESSAGE"
          echo "Environment from prepare job: $PREVIOUS_JOB_ENVIRONMENT"

  # ----------------------------------------------------------
  # Job 4: Conditional execution using inputs
  # ----------------------------------------------------------
  test-demo:
    name: Conditional test demonstration
    needs: prepare
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Run test demonstration
        run: |
          echo "The run-tests input was set to true."
          echo "Tests would execute in this job."

  # ----------------------------------------------------------
  # Job 5: Call the reusable workflow
  # The reusable workflow demonstrates the jobs context.
  # ----------------------------------------------------------
  reusable-workflow-demo:
    name: Demonstrate jobs context
    needs:
      - prepare
      - matrix-demo
    uses: ./.github/workflows/reusable-context-demo.yml
    with:
      environment: ${{ inputs.environment }}
      message: ${{ needs.prepare.outputs.generated-message }}

  # ----------------------------------------------------------
  # Job 6: Read the output returned by the reusable workflow
  # ----------------------------------------------------------
  final-summary:
    name: Final workflow summary
    needs:
      - prepare
      - matrix-demo
      - consume-output
      - reusable-workflow-demo

    runs-on: ubuntu-latest

    steps:
      - name: Display reusable workflow output
        env:
          REUSABLE_OUTPUT: ${{ needs.reusable-workflow-demo.outputs.reusable-summary }}
        run: |
          echo "Reusable workflow output: $REUSABLE_OUTPUT"

      - name: Add workflow summary
        env:
          ACTOR: ${{ github.actor }}
          TARGET_ENV: ${{ inputs.environment }}
          NODE_VERSION: ${{ inputs.node-version }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MATRIX_RESULT: ${{ needs.matrix-demo.result }}
          REUSABLE_RESULT: ${{ needs.reusable-workflow-demo.result }}
          REUSABLE_OUTPUT: ${{ needs.reusable-workflow-demo.outputs.reusable-summary }}
        run: |
          {
            echo "# GitHub Actions Context Demo"
            echo ""
            echo "- Triggered by: $ACTOR"
            echo "- Environment: $TARGET_ENV"
            echo "- Selected Node version: $NODE_VERSION"
            echo "- Prepare job result: $PREPARE_RESULT"
            echo "- Matrix job result: $MATRIX_RESULT"
            echo "- Reusable workflow result: $REUSABLE_RESULT"
            echo "- Reusable workflow output: $REUSABLE_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"
